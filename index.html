<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="xu3BdHZ6H-UfMi2cOT-JAfiRWUJ09l_mFwCwR2msb_Y" />
<title>Project Simian</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  .brand { display: inline-flex; align-items: center; gap: calc(var(--s) * .32); color: #222830; text-decoration: none; }
  .brand img { width: calc(var(--s) * 1.12); height: auto; display: block; }
  .brand .bar { width: max(2px, calc(var(--s) * .022)); align-self: stretch; margin: calc(var(--s) * .12) 0; background: #0751FA; border-radius: 2px; }
  .brand .words { font-weight: 400; font-family: Montserrat, -apple-system, sans-serif; line-height: .98; font-size: calc(var(--s) * .38); letter-spacing: -.01em; }
  .brand .words b { display: block; font-weight: 700; font-size: 1.18em; }
  body { margin: 0; background: #F3F0FF; color: #212529; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 16px; }
  h1 { margin: 0 0 16px; }
  .card { display: flex; gap: 20px; align-items: center; background: #fff; border-radius: 24px; padding: 24px; box-shadow: 0 4px 18px rgba(112, 72, 232, .12); margin-top: 32px; }
  .card img { width: 96px; height: 96px; border-radius: 22px; flex-shrink: 0; }
  .card h2 { margin: 0; color: #7048E8; }
  .card p { margin: 4px 0 8px; }
  a { color: #7048E8; }
  footer { margin-top: 40px; color: #868E96; font-size: 15px; }
  @media (max-width: 480px) { .card { flex-direction: column; text-align: center; } }
</style>
</head>
<body>
<main>
  <h1 style="--s: min(150px, 25vw)"><a class="brand" href="/" aria-label="Project Simian"><img src="/assets/mark.svg" alt=""><span class="bar"></span><span class="words">Project<b>Simian</b></span></a></h1>
  <p>Εκπαιδευτικές εφαρμογές για παιδιά. Χωρίς διαφημίσεις, χωρίς συλλογή δεδομένων.</p>
  <div class="card">
    <img src="/mikroi-mathites/icon.png" alt="Μικροί Μαθητές">
    <div>
      <h2>Μικροί Μαθητές</h2>
      <p>Γράμματα, αριθμοί, λέξεις, παραμύθια και παιχνίδια για παιδιά 3–7 ετών, με τη Σοφούλα.</p>
      <a href="/mikroi-mathites/privacy/">Πολιτική απορρήτου</a>
    </div>
  </div>
  <footer>Επικοινωνία: <a href="mailto:info@projectsimian.com">info@projectsimian.com</a> · © Project Simian</footer>
</main>
</body>
</html>
